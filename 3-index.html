<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS Serverless Visitor Counter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🚀 Serverless Visitor Counter</h1>

        <p>
            Welcome to my AWS Serverless Application
        </p>

        <div class="counter-box">

            <h2>Total Visitors</h2>

            <h1 id="visitor-count">

        </div>

        <p class="info">
            Built using AWS Lambda, API Gateway, DynamoDB and S3
        </p>

    </div>


    <script src="app.js"></script>

</body>

</html>
